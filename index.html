এবং পোড়া জায়গা ঠান্ডা পানিতে ধুয়ে পরিষ্কার কাপড়ে ঢাকুন।\n❌ করবেন না: বিদ্যুৎ বন্ধ না করে খালি হাতে রোগীকে ছোঁবেন না; ভেজা জায়গায় দাঁড়াবেন না; ছেঁড়া তার বা উচ্চ ভোল্টেজ লাইনের কাছে যাবেন না (৯৯৯ বা বিদ্যুৎ অফিসে জানান)।\n🚑 হাসপাতালে: সামান্য মনে হলেও সবাইকে ডাক্তার দেখান—হৃদস্পন্দনের গোলমাল ও ভেতরের পোড়া পরে বোঝা যায়।\n⚠️ সতর্কতা: বজ্রপাতে আহত ব্যক্তির শরীরে বিদ্যুৎ থাকে না, তাকে ছোঁয়া নিরাপদ; শ্বাস না থাকলে দ্রুত সিপিআর দিন।","e","বিদ্যুৎ শক বিদ্যুতের শক ইলেকট্রিক শক বজ্রপাত electric shock"],["☀️ হিটস্ট্রোক / প্রচণ্ড গরমে অসুস্থ","🔎 লক্ষণ: প্রচণ্ড গরমে খুব বেশি জ্বর (প্রায় ৪০°সে. বা তার বেশি), মাথা ঘোরা, মাথাব্যথা, বমি ভাব, বিভ্রান্তি, কথা জড়ানো, ত্বক গরম ও লালচে, খিঁচুনি বা অজ্ঞান হওয়া। ঘাম বন্ধও হতে পারে, আবার ঘেমেও থাকতে পারে।\n✅ করণীয়: সঙ্গে সঙ্গে ছায়া বা ঠান্ডা জায়গায় নিন, বাড়তি কাপড় খুলে দিন। সারা শরীরে ঠান্ডা পানি ঢালুন বা ভেজা কাপড়ে মুছে পাখার বাতাস করুন; ঘাড়, বগল ও কুঁচকিতে ঠান্ডা প্যাক দিন। জ্ঞান পরিষ্কার থাকলে অল্প অল্প করে পানি বা ওরস্যালাইন দিন।\n❌ করবেন না: অজ্ঞান বা বিভ্রান্ত রোগীর মুখে কিছু দেবেন না। বন্ধ গাড়িতে শিশু বা বয়স্ককে কখনো রেখে যাবেন না।\n🚑 হাসপাতালে: বিভ্রান্তি, অজ্ঞান ভাব বা খিঁচুনি থাকলে সঙ্গে সঙ্গে ৯৯৯/হাসপাতাল—এটি জীবনঘাতী হতে পারে; পথে ঠান্ডা করা চালিয়ে যান।","e","হিটস্ট্রোক লু গরমে অসুস্থ রোদে অসুস্থ heat stroke"],["🤧 তীব্র অ্যালার্জি (অ্যানাফাইলাক্সিস)","🔎 লক্ষণ: খাবার, ওষুধ, কামড় বা হুলের পর মুখ-ঠোঁট-গলা ফোলা, শ্বাসকষ্ট বা ঘড়ঘড় শব্দ, সারা শরীরে চাকা-চাকা দাগ, মাথা ঘোরা, বমি বা অজ্ঞান ভাব।\n✅ করণীয়: সঙ্গে সঙ্গে ৯৯৯ বা হাসপাতাল। ডাক্তারের দেওয়া অ্যাড্রেনালিন অটো-ইনজেক্টর (এপিপেন) থাকলে উরুর বাইরের দিকে সঙ্গে সঙ্গে ব্যবহার করুন। কারণ (যেমন হুল বা খাবার) সরিয়ে নিন। শ্বাসকষ্ট না থাকলে শুইয়ে পা উঁচু রাখুন; শ্বাসকষ্ট থাকলে বসিয়ে রাখুন; অজ্ঞান হলে কাত করে শোয়ান।\n❌ করবেন না: রোগীকে হাঁটতে বা হঠাৎ দাঁড়াতে দেবেন না। শুধু অ্যান্টিহিস্টামিন ওষুধ খেয়ে অপেক্ষা করবেন না।\n🚑 হাসপাতালে: লক্ষণ কমে গেলেও যেতে হবে—কিছু সময় পরে আবার বাড়তে পারে।","e","অ্যালার্জি এলার্জি অ্যানাফাইলাক্সিস মুখ ফোলা গলা ফোলা শ্বাসকষ্ট এপিপেন allergy anaphylaxis"],["🩸 গুরুতর রক্তক্ষরণ","✅ করণীয়: পরিষ্কার কাপড় বা গজ দিয়ে ক্ষতের ওপর সরাসরি শক্ত করে চেপে ধরুন—অন্তত ১০ মিনিট একটানা। কাপড় ভিজে গেলে খুলবেন না, ওপরে আরও কাপড় রেখে চাপ বজায় রাখুন। হাড় ভাঙা না থাকলে ক্ষতযুক্ত অঙ্গ হৃদপিণ্ডের চেয়ে উঁচুতে রাখুন। রোগীকে শুইয়ে গরম রাখুন এবং সঙ্গে সঙ্গে ৯৯৯ বা হাসপাতালে নিন।\n❌ করবেন না: ক্ষতে ধুলো, মাটি, কফি, হলুদ বা মশলা দেবেন না; বারবার কাপড় সরিয়ে দেখবেন না; গভীরে ঢুকে থাকা বস্তু টানবেন না।\n⚠️ সতর্কতা: ফ্যাকাসে ভাব, ঠান্ডা ঘাম, দ্রুত দুর্বল নাড়ি, ঝিমুনি—এগুলো 'শক'-এর লক্ষণ, একটুও দেরি করবেন না।","e","রক্তপাত রক্ত পড়া রক্ত বন্ধ প্রচুর রক্ত bleeding"],["🍬 সুগার কমে যাওয়া (হাইপোগ্লাইসেমিয়া)","🔎 লক্ষণ: হঠাৎ ঘাম, কাঁপুনি, তীব্র ক্ষুধা, বুক ধড়ফড়, মাথা ঘোরা, বিভ্রান্তি বা আচরণ বদলে যাওয়া—বিশেষ করে ডায়াবেটিসের ওষুধ বা ইনসুলিন নেওয়া রোগীর। রক্তে সুগার ৩.৯ mmol/L (৭০ mg/dL)-এর নিচে নামলে সাধারণত এমন হয়।\n✅ করণীয়: রোগী জ্ঞানে থাকলে সঙ্গে সঙ্গে দ্রুত কাজ করে এমন প্রায় ১৫ গ্রাম শর্করা দিন—যেমন ৩ চা-চামচ চিনি পানিতে গুলে, গ্লুকোজ বা আধা কাপ ফলের রস/মিষ্টি পানীয়। ১৫ মিনিট পরে লক্ষণ না কমলে (সম্ভব হলে সুগার মেপে) আবার দিন। ভালো হলে হালকা খাবার খান।\n❌ করবেন না: অজ্ঞান বা গিলতে না পারা রোগীর মুখে কিছু ঢালবেন না—বিষম লাগতে পারে।\n🚑 হাসপাতালে: অজ্ঞান হলে বা খিঁচুনি হলে সঙ্গে সঙ্গে ৯৯৯/হাসপাতাল। বারবার সুগার কমলে ডাক্তারকে জানান।","e","সুগার কমে যাওয়া ডায়াবেটিস রক্তে শর্করা কম হাইপো ঘাম কাঁপুনি hypoglycemia low sugar"],["🥶 তীব্র শীতে শরীর ঠান্ডা (হাইপোথার্মিয়া)","🔎 লক্ষণ: তীব্র কাঁপুনি (পরে কাঁপুনি থেমে যেতে পারে), ঠান্ডা ও ফ্যাকাসে ত্বক, কথা জড়ানো, ঝিমুনি, হাঁটতে অসুবিধা, ধীর শ্বাস। বয়স্ক, শিশু ও অসুস্থরা বেশি ঝুঁকিতে।\n✅ করণীয়: রোগীকে ঠান্ডা বাতাস ও ভেজা জায়গা থেকে ঘরে নিন। ভেজা কাপড় আস্তে খুলে শুকনো কাপড়ে ঢেকে কম্বল বা লেপে মুড়িয়ে গরম রাখুন—আগে বুক, ঘাড়, মাথা ও পেট; মাথা ঢেকে রাখুন। জ্ঞান পরিষ্কার থাকলে হালকা গরম মিষ্টি পানীয় দিন।\n❌ করবেন না: হাত-পা জোরে ঘষবেন না; খুব গরম পানিতে ডোবাবেন না বা সরাসরি আগুন/হিটারের তাপ দেবেন না; অজ্ঞান রোগীকে কিছু খাওয়াবেন না।\n🚑 হাসপাতালে: ঝিমুনি বা অজ্ঞান ভাব থাকলে, কাঁপুনি থেমে গিয়েও শরীর ঠান্ডা থাকলে ৯৯৯/হাসপাতাল; রোগীকে খুব আস্তে নাড়াচাড়া করুন।","e","শীত ঠান্ডা হাইপোথার্মিয়া কাঁপুনি শীতে অসুস্থ hypothermia"],["🤰 গর্ভাবস্থা ও প্রসবের বিপদ চিহ্ন","🚑 হাসপাতালে: এগুলোর যেকোনোটি হলে দেরি না করে হাসপাতালে নিন (এম্বুলেন্স ডাকুন)—যোনিপথে রক্তপাত; খিঁচুনি বা অজ্ঞান হওয়া; তীব্র মাথাব্যথা, চোখে ঝাপসা বা ঝলকানি; হাত-মুখ ফোলা; পানি ভাঙা বা তরল ঝরা; পেটে তীব্র ব্যথা; শিশুর নড়াচড়া কমে যাওয়া বা না পাওয়া; জ্বর ও কাঁপুনি; শ্বাসকষ্ট।\n🚑 প্রসব বা গর্ভপাতের পর: অতিরিক্ত রক্তপাত, জ্বর, দুর্গন্ধযুক্ত স্রাব বা খিঁচুনি হলেও জরুরি।\n✅ অপেক্ষার সময়: রোগীকে বাঁ কাত করে শুইয়ে শান্ত রাখুন। খিঁচুনি হলে 'খিঁচুনি' অংশ অনুযায়ী নিরাপদ রাখুন।\n❌ করবেন না: বাড়িতে অপেক্ষা করে সময় নষ্ট করবেন না; অপ্রশিক্ষিত কারও ওপর ভরসা করে দেরি করবেন না।","e","গর্ভবতী গর্ভাবস্থা প্রসব রক্তপাত খিঁচুনি পানি ভাঙা একলামপসিয়া pregnancy danger"],["🔥 পুড়ে যাওয়া","সঙ্গে সঙ্গে ১০–২০ মিনিট ঠান্ডা (বরফ নয়) পানি ঢালুন। ফোসকা ফাটাবেন না। পরিষ্কার কাপড়ে হালকা ঢেকে দিন। টুথপেস্ট, তেল বা মাখন লাগাবেন না। বড় বা মুখ-হাতের পোড়ায় হাসপাতালে যান।","i","পোড়া burn"],["🩸 কেটে যাওয়া","পরিষ্কার কাপড়ে চেপে ধরে রক্ত বন্ধ করুন। পরিষ্কার পানিতে ধুয়ে ব্যান্ডেজ করুন। রক্ত না থামলে বা ক্ষত গভীর হলে ডাক্তার দেখান; ধুলো-মরিচা লাগা হলে টিটেনাস টিকা নিন।","i","কাটা ক্ষত"],["👃 নাক দিয়ে রক্ত","সোজা হয়ে বসে সামনে ঝুঁকুন। নাকের নরম অংশ ১০ মিনিট চেপে ধরুন। মাথা পেছনে হেলাবেন না। ২০ মিনিটে না থামলে ডাক্তার দেখান।","i","নাকে রক্ত"],["🦴 হাড় ভাঙা বা জোড়া সরে যাওয়া সন্দেহ","🔎 লক্ষণ: তীব্র ব্যথা, ফোলা, অঙ্গ বাঁকা দেখানো, নাড়াতে না পারা বা ভর দিতে না পারা।\n✅ করণীয়: আহত অংশ যেভাবে আছে সেভাবেই নড়াচড়া বন্ধ রাখুন। কাঠ, ভাঁজ করা পত্রিকা বা শক্ত কিছু দিয়ে ভাঙা জায়গার ওপর ও নিচের দুই জোড়াসহ কাপড় দিয়ে হালকা করে বেঁধে স্থির করুন। ফোলা কমাতে কাপড়ে মোড়া বরফ ১৫–২০ মিনিট দিন। খোলা ক্ষত থাকলে পরিষ্কার কাপড়ে ঢেকে ক্ষতের আশপাশে হালকা চাপে রক্ত থামান।\n❌ করবেন না: হাড় সোজা করার বা বেরিয়ে আসা হাড় ভেতরে ঢোকানোর চেষ্টা করবেন না; জোরে টানাটানি বা মালিশ করাবেন না।\n🚑 হাসপাতালে: যত দ্রুত সম্ভব এক্স-রে ও চিকিৎসার জন্য। ঘাড়, পিঠ বা মাথায় আঘাতের সন্দেহ থাকলে রোগীকে একদম নাড়াবেন না, এম্বুলেন্স ডাকুন। অঙ্গ নীল, ঠান্ডা বা অসাড় হলে জরুরি।","i","হাড় ভাঙা ফ্র্যাকচার ভাঙা হাড় জোড়া খুলে যাওয়া দুর্ঘটনায় আঘাত fracture"],["🦶 মচকানো / মাংসপেশি টান","✅ করণীয়: বিশ্রাম দিন ও আহত অঙ্গে ভর দেবেন না। প্রথম ২–৩ দিন কাপড়ে মোড়া বরফ বা ঠান্ডা সেঁক ১৫–২০ মিনিট করে দিনে কয়েকবার দিন। ইলাস্টিক ব্যান্ডেজ দিয়ে হালকা চাপে (খুব টাইট নয়) বাঁধুন এবং অঙ্গ বালিশে উঁচু করে রাখুন।\n❌ করবেন না: প্রথম ২৪–৪৮ ঘণ্টা গরম সেঁক, জোরে মালিশ বা গরম তেল দেবেন না; বরফ সরাসরি ত্বকে লাগাবেন না।\n🚑 হাসপাতালে: একদমই ভর দিতে না পারলে, তীব্র ফোলা বা অঙ্গ বিকৃত দেখালে, অসাড় লাগলে অথবা ৩–৫ দিনেও না কমলে এক্স-রে ও ডাক্তার দেখান।","i","মচকানো মচকে যাওয়া মাংসপেশি টান পা মচকানো ব্যথা ফোলা sprain"],["🤕 মাথায় আঘাত","✅ করণীয়: ক্ষত থাকলে পরিষ্কার কাপড়ে চেপে রক্ত থামান; ফোলায় কাপড়ে মোড়া বরফ দিন। রোগীকে বিশ্রামে রাখুন এবং পরবর্তী ২৪ ঘণ্টা কাছে থেকে নজর রাখুন।\n🚑 হাসপাতালে: এখনই নিন যদি—অজ্ঞান হয় বা ঝিমুনি/বিভ্রান্তি দেখা যায়; বারবার বমি হয়; মাথাব্যথা তীব্র বা বাড়তে থাকে; খিঁচুনি হয়; কান বা নাক দিয়ে রক্ত বা পানির মতো তরল বের হয়; হাত-পা দুর্বল বা কথা জড়িয়ে যায়; চোখের মণি অসমান দেখায়; শিশু অস্বাভাবিক কাঁদে বা খেতে চায় না।\n❌ করবেন না: সড়ক দুর্ঘটনা বা উঁচু থেকে পড়ার পর ঘাড়ে আঘাতের সন্দেহ থাকলে রোগীকে নাড়াবেন বা বসাবেন না। ক্ষতে ঢুকে থাকা বস্তু টানবেন না।","i","মাথায় আঘাত মাথা ফেটে যাওয়া মাথায় চোট পড়ে যাওয়া head injury"],["👁️ চোখে আঘাত বা কিছু পড়া","✅ ধুলো বা ময়লা পড়লে: চোখ কচলাবেন না। পরিষ্কার পানি বা স্যালাইনে চোখ ধুয়ে ফেলুন; উপরের পাতা নিচের পাতার ওপর টেনে নিয়ে বারবার পলক ফেলুন।\n✅ রাসায়নিক লাগলে: অ্যাসিড, চুন, ব্লিচ বা কীটনাশক লাগলে মাথা কাত করে প্রবাহিত পরিষ্কার পানিতে অন্তত ১৫–২০ মিনিট ধুতে থাকুন; কন্টাক্ট লেন্স থাকলে খুলে নিন। ধোয়া চালিয়ে যেতে যেতেই হাসপাতালে রওনা দিন।\n❌ করবেন না: চোখে গেঁথে থাকা বস্তু টানবেন না; আঘাত পাওয়া চোখে চাপ দেবেন না; ঘরোয়া ড্রপ, দুধ বা মধু দেবেন না।\n🚑 হাসপাতালে: ব্যথা, ঝাপসা দেখা, লাল ভাব বা কিছু আটকে আছে মনে হলে পরিষ্কার কাপড়ে ঢিলেভাবে ঢেকে চক্ষু চিকিৎসকের কাছে যান।","i","চোখে আঘাত চোখে কিছু পড়া চোখে ময়লা চোখে রাসায়নিক চোখ জ্বালা চোখে চুন eye injury"],["👂 কান-নাকে কিছু ঢুকলে / বোতাম ব্যাটারি গিলে ফেললে","✅ করণীয়: নিজে শান্ত থাকুন ও শিশুকে শান্ত রাখুন। কানে পোকা বা কিছু ঢুকলে মাথা কাত করে সেই কান নিচের দিকে রাখুন। নাকে কিছু ঢুকলে মুখ বন্ধ রেখে অন্য নাক চেপে ধীরে নাক ঝাড়তে বলুন।\n❌ করবেন না: কাঠি, কটনবাড, চিমটা বা সেফটিপিন দিয়ে খোঁচাবেন না—জিনিসটি আরও ভেতরে যেতে বা কান-নাকের ক্ষতি হতে পারে। শিশুকে জোরে শ্বাস টানতে দেবেন না।\n🚑 হাসপাতালে: বস্তু না বেরোলে, কান থেকে রক্ত বা পুঁজ এলে বা তীব্র ব্যথা হলে নাক-কান-গলা (ইএনটি) ডাক্তারের কাছে যান।\n⚠️ সতর্কতা: ছোট গোল বোতাম ব্যাটারি বা চুম্বক গিলে ফেললে বা নাক-কানে ঢুকলে এটি জরুরি—সঙ্গে সঙ্গে হাসপাতালে নিন; বমি করানোর চেষ্টা বা খাবার দেওয়া থেকে বিরত থাকুন।","i","কানে পোকা নাকে কিছু ঢোকা শিশু কিছু গিলে ফেলা বোতাম ব্যাটারি ব্যাটারি চুম্বক foreign body"],["🦷 দাঁত ভেঙে বা পড়ে গেলে","✅ করণীয়: স্থায়ী দাঁত পড়ে গেলে শুধু মাথার (চিবানোর) অংশ ধরুন, গোড়ায় হাত দেবেন না বা ঘষবেন না। ময়লা থাকলে খুব অল্প সময় দুধে বা পরিষ্কার পানিতে ধুয়ে নিন। পারলে দাঁতটি নিজের জায়গায় বসিয়ে আস্তে কামড়ে ধরে রাখুন; না পারলে ঠান্ডা দুধে ডুবিয়ে রেখে (বা সাবধানে গালের ভেতরে রেখে) ৩০–৬০ মিনিটের মধ্যে দন্তচিকিৎসকের কাছে যান। রক্ত পড়লে পরিষ্কার গজে চেপে ধরুন।\n❌ করবেন না: দাঁত শুকনো কাপড় বা টিস্যুতে মুড়ে রাখবেন না; দুধের (শিশুর) দাঁত আবার বসাবেন না; দাঁত ঘষে পরিষ্কার করতে যাবেন না।","i","দাঁত ভাঙা দাঁত পড়ে যাওয়া দাঁতে আঘাত দাঁত উপড়ে যাওয়া tooth knocked out"],["🔥 গায়ে আগুন ধরে গেলে","✅ করণীয়: দৌড়াবেন না। থেমে মাটিতে শুয়ে পড়ুন, দুই হাতে মুখ ঢেকে গড়াগড়ি দিন। অন্য কারও গায়ে আগুন লাগলে মোটা কাপড়, কম্বল বা চাদর দিয়ে চেপে ধরে আগুন নেভান বা পানি ঢালুন। আগুন নিভলে ১০–২০ মিনিট ঠান্ডা (বরফ নয়) পানি ঢালুন; ফুলে ওঠার আগে আংটি, ঘড়ি, চুড়ি খুলে ফেলুন।\n❌ করবেন না: পোড়া চামড়ায় লেগে থাকা কাপড় টেনে খুলবেন না (আশপাশ কেটে সরান); ফোসকা ফাটাবেন না; তেল, ক্রিম বা টুথপেস্ট দেবেন না।\n🚑 হাসপাতালে: শরীরের বড় অংশ পুড়লে, মুখ-নাকে কালি, গলা ভাঙা বা কাশি থাকলে (শ্বাসনালি পোড়ার লক্ষ
